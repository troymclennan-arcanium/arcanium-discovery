    async function dec(pw){const b=Uint8Array.from(atob(D),c=>c.charCodeAt(0));const s=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
     const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
     const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
     return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct))}
    async function go(pw,quiet){const e=document.getElementById('e');e.textContent='Opening...';try{const h=await dec(pw);try{sessionStorage.setItem(SK,pw)}catch(x){}
     document.open();document.write(h);document.close()}catch(x){e.textContent=quiet?'':'That passcode did not work. Please try again.'}}
    document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();go(document.getElementById('p').value.trim())});
